<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Activity Calendar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<style>
  :root{
    --paper:#F7F6F2;
    --panel:#FFFFFF;
    --ink:#1E2422;
    --ink-soft:#5B655F;
    --line:#E1DFD7;
    --line-strong:#C8C5B8;
    --ryde:#2F6F9F;
    --hornsby:#3F8F5F;
    --chatswood:#8A4FA6;
    --brookvale:#C9772E;
    --accent:#1E2422;
    --today-ring:#1E2422;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;
    grid-template-columns: 1fr 320px;
    gap:20px;
    padding:20px;
    max-width:1280px;
    margin:0 auto;
  }
  @media (max-width: 860px){
    .app{grid-template-columns:1fr;}
  }

  /* Header */
  .brand{
    grid-column:1 / -1;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:4px;
  }
  .brand h1{
    font-size:20px;
    letter-spacing:0.02em;
    margin:0;
    font-weight:700;
  }
  .brand .sub{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.03em;
    text-transform:uppercase;
  }

  /* Calendar panel */
  .cal-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .cal-nav .month-label{
    font-size:17px;
    font-weight:700;
    letter-spacing:0.01em;
  }
  .nav-btns{display:flex; gap:6px; align-items:center; flex:none;}
  .nav-btns button:not(.today-btn){
    border:1px solid var(--line-strong);
    background:var(--panel);
    color:var(--ink);
    width:30px; height:30px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-btns button:hover{background:var(--paper);}
  .today-btn{
    border:1px solid var(--line-strong);
    background:var(--panel);
    padding:0 16px;
    width:auto;
    height:30px;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--ink-soft);
    white-space:nowrap;
    flex:none;
  }
  .today-btn:hover{background:var(--paper);}

  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .weekday-row div{
    text-align:center;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding-bottom:4px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:96px;
    gap:6px;
  }
  @media (max-width:600px){
    .grid{grid-auto-rows:74px;}
  }
  .day{
    position:relative;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    padding:6px 6px 8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:border-color .12s, background .12s;
  }
  .day:hover{border-color:var(--line-strong); background:#F1F0EA;}
  .day.selected{border-color:var(--ink); background:#FFFFFF; box-shadow:0 0 0 1px var(--ink) inset;}
  .day.outside{opacity:0.35;}
  .day.today .daynum{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;height:20px;
    border-radius:50%;
    background:var(--today-ring);
    color:#fff;
  }
  .daynum{
    font-size:12px;
    font-weight:600;
    color:var(--ink);
  }
  .daycount{
    font-size:10px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .loadbar{
    display:flex;
    gap:2px;
    height:6px;
    margin-top:6px;
    border-radius:3px;
    overflow:hidden;
    background:transparent;
  }
  .loadbar span{
    flex:1;
    border-radius:2px;
    min-width:3px;
  }

  /* Sidebar */
  .sidebar{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .card h2{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:0 0 10px;
    font-weight:700;
  }
  .filters{display:flex; flex-direction:column; gap:8px;}
  .filter-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .swatch{
    width:11px;height:11px;border-radius:3px;flex:none;
  }
  .filter-row input{accent-color:var(--ink); width:14px; height:14px; margin:0;}
  .filter-row.off{opacity:0.4;}

  .day-detail .date-heading{
    font-size:15px;
    font-weight:700;
    margin-bottom:2px;
  }
  .day-detail .date-sub{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .activity-item{
    border:1px solid var(--line);
    border-left:4px solid var(--ink);
    border-radius:6px;
    padding:8px 10px;
    margin-bottom:8px;
    font-size:12.5px;
    background:var(--paper);
    position:relative;
  }
  .activity-item .a-title{font-weight:700; margin-bottom:2px; padding-right:18px;}
  .activity-item .a-meta{color:var(--ink-soft); font-size:11px;}
  .activity-item .a-notes{margin-top:4px; color:var(--ink); font-size:11.5px;}
  .activity-item .a-del{
    position:absolute; top:6px; right:8px;
    border:none; background:none; cursor:pointer;
    color:var(--ink-soft); font-size:13px; line-height:1;
    padding:2px;
  }
  .activity-item .a-del:hover{color:#B5443B;}
  .empty-note{
    font-size:12px;
    color:var(--ink-soft);
    padding:10px 0;
  }

  .add-btn{
    width:100%;
    padding:9px 0;
    border-radius:7px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.02em;
    cursor:pointer;
    margin-top:6px;
  }
  .add-btn:hover{opacity:0.88;}

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,22,20,0.35);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:16px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;
    border-radius:12px;
    width:100%;
    max-width:380px;
    padding:20px;
    box-shadow:0 12px 40px rgba(0,0,0,0.2);
  }
  .modal h3{margin:0 0 14px; font-size:15px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin-bottom:4px;
    font-weight:700;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:8px 9px;
    border:1px solid var(--line-strong);
    border-radius:6px;
    font-size:13px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:50px;}
  .field select{-webkit-appearance:none; appearance:none;}
  .site-options{display:flex; gap:8px; flex-wrap:wrap;}
  .site-chip{
    padding:6px 10px;
    border-radius:7px;
    border:1.5px solid var(--line-strong);
    font-size:12px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    background:var(--paper);
  }
  .site-chip.active{border-color:var(--ink); background:#fff; font-weight:700;}
  .modal-actions{
    display:flex; gap:8px; margin-top:16px;
  }
  .modal-actions button{
    flex:1;
    padding:9px 0;
    border-radius:7px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-cancel{border:1px solid var(--line-strong); background:#fff; color:var(--ink);}
  .btn-save{border:1px solid var(--ink); background:var(--ink); color:#fff;}
  .status-msg{
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:6px;
    min-height:14px;
  }

  /* Search */
  .search-wrap{
    position:relative;
    margin-bottom:14px;
  }
  .search-wrap input{
    width:100%;
    padding:9px 34px 9px 12px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    font-size:13px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  .search-wrap input:focus{outline:none; border-color:var(--ink);}
  .search-clear{
    position:absolute;
    right:8px; top:50%; transform:translateY(-50%);
    border:none; background:none; cursor:pointer;
    color:var(--ink-soft); font-size:15px; line-height:1;
    display:none;
  }
  .search-wrap.has-text .search-clear{display:block;}
  .search-results{
    position:absolute;
    top:calc(100% + 4px);
    left:0; right:0;
    background:#fff;
    border:1px solid var(--line-strong);
    border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
    max-height:260px;
    overflow-y:auto;
    z-index:20;
    display:none;
  }
  .search-results.show{display:block;}
  .search-result-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    cursor:pointer;
    font-size:12.5px;
    border-bottom:1px solid var(--line);
  }
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:var(--paper);}
  .search-result-item .swatch{flex:none;}
  .search-result-item .sr-title{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .search-result-item .sr-date{color:var(--ink-soft); font-size:11px; flex:none;}
  .search-empty{
    padding:10px;
    font-size:12px;
    color:var(--ink-soft);
  }

  .activity-item.flash{
    animation:flashHighlight 1.6s ease-out;
  }
  @keyframes flashHighlight{
    0%{background:#FFF3D6;}
    100%{background:var(--paper);}
  }

  .detail-head-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom:2px;
  }
  .sort-select{
    font-size:11px;
    padding:4px 6px;
    border:1px solid var(--line-strong);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink-soft);
    font-family:inherit;
  }

  .export-buttons{display:flex; flex-direction:column; gap:8px;}
  .export-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 0;
    border-radius:7px;
    border:1px solid var(--line-strong);
    background:var(--panel);
    color:var(--ink);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .export-btn:hover{background:var(--paper); border-color:var(--ink);}

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block;
      position:absolute; top:0; left:0; width:100%;
      padding:20px;
    }
    #printArea h1{font-size:16px; margin:0 0 4px;}
    #printArea .print-sub{font-size:11px; color:#555; margin-bottom:14px;}
    #printArea table{width:100%; border-collapse:collapse; font-size:11px;}
    #printArea th, #printArea td{border:1px solid #ccc; padding:5px 7px; text-align:left;}
    #printArea th{background:#f0f0f0;}
    #printArea table.month-print{table-layout:fixed;}
    #printArea table.month-print th{font-size:9px; text-align:center; padding:4px;}
    #printArea table.month-print td{
      vertical-align:top; height:85px; font-size:8.5px; padding:3px 4px; overflow:hidden;
    }
    #printArea table.month-print td.outside-month{color:#aaa; background:#fafafa;}
    #printArea .mp-daynum{font-weight:700; font-size:10px; margin-bottom:2px; display:block;}
    #printArea .mp-act{margin-bottom:1px; line-height:1.25;}
    #printArea .mp-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:3px;}
  }
  .field.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field.two-col label{margin-bottom:4px;}

  .site-rows{
    display:flex;
    flex-direction:column;
    gap:3px;
    margin-top:6px;
  }
  .site-row{
    position:relative;
    height:8px;
    border-radius:3px;
    background:transparent;
  }
  .site-row.filled{cursor:pointer;}
  .site-row-fill{
    display:block;
    width:100%;
    height:100%;
    border-radius:3px;
    transition:opacity .1s;
  }
  .site-row.filled:hover .site-row-fill{opacity:0.8;}
  .site-tooltip{
    display:none;
    position:absolute;
    bottom:calc(100% + 4px);
    left:0;
    background:#fff;
    border:1px solid var(--line-strong);
    border-radius:6px;
    padding:6px 8px;
    font-size:10.5px;
    line-height:1.5;
    white-space:nowrap;
    z-index:30;
    box-shadow:0 6px 18px rgba(0,0,0,0.16);
    text-align:left;
  }
  .site-tooltip .st-site{font-weight:700; margin-bottom:2px; display:block;}
  .site-row.filled:hover .site-tooltip{display:block;}

  .activity-item .a-edit{
    position:absolute; top:6px; right:26px;
    border:none; background:none; cursor:pointer;
    color:var(--ink-soft); font-size:12px; line-height:1;
    padding:2px;
  }
  .activity-item .a-edit:hover{color:var(--ink);}
  .activity-item .a-id{
    display:inline-block;
    font-size:10px;
    color:var(--ink-soft);
    background:var(--line);
    border-radius:4px;
    padding:1px 5px;
    margin-left:6px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="brand">
    <div>
      <h1>Activity Calendar</h1>
      <div class="sub">Ryde · Hornsby · Chatswood · Brookvale</div>
      <div id="authWidget" style="margin-top:8px; font-size:12px;">
        <button id="signInBtn" class="today-btn" style="text-transform:none;">Sign in to edit</button>
        <div id="signInForm" style="display:none; margin-top:6px; gap:6px; align-items:center;">
          <input id="authEmail" type="email" placeholder="Email" style="padding:6px 8px; border:1px solid var(--line-strong); border-radius:6px; font-size:12px; margin-right:4px;">
          <input id="authPassword" type="password" placeholder="Password" style="padding:6px 8px; border:1px solid var(--line-strong); border-radius:6px; font-size:12px; margin-right:4px;">
          <button id="authSubmitBtn" class="today-btn" style="text-transform:none;">Sign in</button>
          <button id="authCancelBtn" class="today-btn" style="text-transform:none;">Cancel</button>
          <div id="authError" style="color:#B5443B; font-size:11px; margin-top:4px;"></div>
        </div>
        <div id="signedInWidget" style="display:none; align-items:center; gap:8px;">
          <span style="color:var(--ink-soft);">Signed in as <span id="authUserEmail"></span></span>
          <button id="signOutBtn" class="today-btn" style="text-transform:none;">Sign out</button>
        </div>
      </div>
    </div>
  </div>

  <div class="cal-panel">
    <div class="cal-nav">
      <div class="month-label" id="monthLabel">—</div>
      <div class="nav-btns">
        <button id="prevBtn" title="Previous month">&#8249;</button>
        <button class="today-btn" id="todayBtn">Today</button>
        <button id="nextBtn" title="Next month">&#8250;</button>
      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <input id="searchInput" type="text" placeholder="Search activities by name...">
      <button class="search-clear" id="searchClear" title="Clear">&times;</button>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="weekday-row">
      <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="sidebar">
    <div class="card">
      <h2>Export</h2>
      <div class="export-buttons">
        <button class="export-btn" id="exportExcelBtn">Export to Excel (.xlsx)</button>
        <button class="export-btn" id="exportPdfBtn">Export to PDF</button>
        <button class="export-btn" id="printMonthBtn">Print Month View</button>
        <button class="export-btn" id="exportIcsBtn">Export Calendar (.ics)</button>
      </div>
    </div>

    <div class="card">
      <h2>Filter by site</h2>
      <div class="filters" id="filters"></div>
    </div>

    <div class="card day-detail" id="dayDetail">
      <div class="detail-head-row">
        <div>
          <div class="date-heading" id="detailHeading">Select a day</div>
          <div class="date-sub" id="detailSub"></div>
        </div>
        <select class="sort-select" id="sortSelect">
          <option value="time">Sort: Time</option>
          <option value="site">Sort: Site</option>
          <option value="alpha">Sort: A–Z</option>
        </select>
      </div>
      <div id="activityList"></div>
      <button class="add-btn" id="openAddBtn">+ Add activity</button>
    </div>

    <div class="card">
      <h2>Next 14 Days</h2>
      <div id="twoWeekList" style="max-height:280px; overflow-y:auto;"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add activity</h3>
    <div class="field">
      <label>Title</label>
      <input id="fTitle" type="text" placeholder="e.g. Work Foundations group session">
    </div>
    <div class="field">
      <label>Activity type (optional)</label>
      <select id="fPpType">
        <option value="">— None selected —</option>
        <optgroup label="Table 5-A — Education">
          <option>Accredited Education — Full Qualification (Cert III or higher)</option>
          <option>Accredited Education — AMEP (Adult Migrant English Program)</option>
          <option>Accredited Education — SEE (Skills for Education and Employment)</option>
        </optgroup>
        <optgroup label="Table 5-B — Work Placements">
          <option>Work for the Dole</option>
          <option>Voluntary Work — Provider Sourced</option>
          <option>Voluntary Work — Participant Sourced</option>
          <option>Observational Work Experience (OWE)</option>
          <option>Paid Work (no outcome)</option>
          <option>Launch into Work</option>
          <option>Local Jobs Program</option>
          <option>Defence Reserves</option>
          <option>WorkFoundations</option>
        </optgroup>
        <optgroup label="Table 5-C — Vocational Interventions">
          <option>Career Transition Assistance (CTA) completion</option>
          <option>Employability Skills Training (EST) completion</option>
          <option>Skill Based Qualification Completion — Accredited (less than Cert III, one or more units)</option>
          <option>Skill Based Qualification Completion — Non-Accredited (barista, software training, food safety etc)</option>
          <option>Workplace Certification Completion (RSA, RCG, White Card, forklift licence etc)</option>
          <option>Language Literacy and Numeracy (LLN) training completion</option>
          <option>Non-Government Program (NGP)</option>
          <option>Self-Employment Assistance — Small Business Training</option>
          <option>Self-Employment Assistance — Exploring Self-Employment Workshops</option>
          <option>Workforce Specialist Project (vocational)</option>
        </optgroup>
        <optgroup label="Table 5-D — Non-Vocational Interventions">
          <option>Counselling and Mental Health Program</option>
          <option>Drug and Alcohol Program</option>
          <option>Addressing Transport Access Issues (e.g. driver's licence)</option>
          <option>Addressing Housing Stability Issues</option>
          <option>Addressing Caring Responsibilities</option>
          <option>Cultural Participation Program</option>
          <option>Workforce Specialist Project (non-vocational)</option>
        </optgroup>
        <optgroup label="Table 5-E — Pathway to Employment">
          <option>WorkFoundations — Successful Completion</option>
          <option>Launch into Work — Successful Completion</option>
          <option>Workforce Specialist Project — Pathway to Employment</option>
        </optgroup>
        <optgroup label="PP Review">
          <option>Progress Payment Review</option>
        </optgroup>
      </select>
    </div>
    <div class="field">
      <label>Site (select one or more)</label>
      <div class="site-options" id="siteOptions"></div>
    </div>
    <div class="field two-col">
      <div>
        <label>Start date</label>
        <input id="fDateStart" type="date">
      </div>
      <div>
        <label>End date (optional)</label>
        <input id="fDateEnd" type="date">
      </div>
    </div>
    <div class="field two-col">
      <div>
        <label>Start time (optional)</label>
        <input id="fTimeStart" type="time">
      </div>
      <div>
        <label>End time (optional)</label>
        <input id="fTimeEnd" type="time">
      </div>
    </div>
    <div class="field two-col">
      <div>
        <label>Location (optional)</label>
        <input id="fLocation" type="text" placeholder="e.g. Room 2, 45 Blaxland Rd">
      </div>
      <div>
        <label>Activity ID (optional)</label>
        <input id="fActivityId" type="text" inputmode="numeric" placeholder="e.g. 10234">
      </div>
    </div>
    <div class="field two-col">
      <div>
        <label>Spots filled (optional)</label>
        <input id="fCapacityFilled" type="number" min="0" placeholder="e.g. 6">
      </div>
      <div>
        <label>Total spots (optional)</label>
        <input id="fCapacityTotal" type="number" min="0" placeholder="e.g. 12">
      </div>
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="fNotes" placeholder="Host, cohort, other detail..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Save</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModalBox">
    <h3 id="detailModalTitle">Activity</h3>
    <div id="detailModalBody" style="font-size:13px; line-height:1.7;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="detailCloseBtn">Close</button>
      <button class="btn-save" id="detailCopyBtn">Copy details</button>
    </div>
    <div class="status-msg" id="detailCopyMsg"></div>
  </div>
</div>

<div id="printArea"></div>

<script>
(function(){
  // ============================================================
  // FIREBASE CONFIG — REPLACE THE VALUES BELOW WITH YOUR OWN.
  // Get these from: Firebase console > Project settings > Your apps > web app.
  // Until you replace these, nothing will save.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDvgWNzX8pjdjqUo7gAcqOgIZ_Ykp-hihg",
    authDomain: "wise-activity-calendar.firebaseapp.com",
    projectId: "wise-activity-calendar",
    storageBucket: "wise-activity-calendar.firebasestorage.app",
    messagingSenderId: "321273721895",
    appId: "1:321273721895:web:4c933acbb57279cce38a02"
  };
  const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "REPLACE_WITH_YOUR_API_KEY";

  let db = null;
  let docRef = null;
  let auth = null;
  let isEditor = false;
  if(!CONFIG_IS_PLACEHOLDER){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    docRef = db.collection('wise_calendar').doc('main');
    auth = firebase.auth();
  }

  const SITES = [
    {id:'ryde', name:'Ryde', color:'var(--ryde)', hex:'#2F6F9F'},
    {id:'hornsby', name:'Hornsby', color:'var(--hornsby)', hex:'#3F8F5F'},
    {id:'chatswood', name:'Chatswood', color:'var(--chatswood)', hex:'#8A4FA6'},
    {id:'brookvale', name:'Brookvale', color:'var(--brookvale)', hex:'#C9772E'}
  ];

  let activities = [];
  let activeFilters = new Set(SITES.map(s=>s.id));
  let viewDate = new Date();
  let selectedDateStr = fmtDate(new Date());
  let editingId = null;
  let storageOK = true;
  let sortMode = 'time';
  let flashId = null;

  function fmtDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayStr(){ return fmtDate(new Date()); }
  function siteById(id){ return SITES.find(s=>s.id===id); }

  // Converts legacy single-site/single-date records into the new shape,
  // and fills in defaults for any missing fields on newer records.
  function normalizeActivity(a){
    const sites = Array.isArray(a.sites) ? a.sites.slice()
                : (a.site ? [a.site] : []);
    const startDate = a.startDate || a.date || '';
    const endDate = a.endDate || a.startDate || a.date || '';
    return {
      id: a.id,
      title: a.title || '',
      sites,
      startDate,
      endDate,
      time: a.time || '',
      endTime: a.endTime || '',
      location: a.location || '',
      activityId: a.activityId || '',
      ppType: a.ppType || '',
      capacityFilled: a.capacityFilled != null ? a.capacityFilled : '',
      capacityTotal: a.capacityTotal != null ? a.capacityTotal : '',
      notes: a.notes || ''
    };
  }

  function formatDayDate(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    const dayAbbr = d.toLocaleDateString('en-AU', {weekday:'short'}).toUpperCase().slice(0,3);
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return `${dayAbbr} ${dd}/${mm}`;
  }
  function formatDateRangeLabel(startDate, endDate){
    if(startDate === endDate) return formatDayDate(startDate);
    return `${formatDayDate(startDate)} to ${formatDayDate(endDate)}`;
  }
  function formatTime12(t){
    if(!t) return '';
    const [h,m] = t.split(':').map(Number);
    const period = h >= 12 ? 'pm' : 'am';
    let hour12 = h % 12; if(hour12 === 0) hour12 = 12;
    return `${hour12}:${String(m).padStart(2,'0')}${period}`;
  }
  function formatTimeRangeLabel(start, end){
    if(!start && !end) return '';
    if(start && end) return `${formatTime12(start)} to ${formatTime12(end)}`;
    return formatTime12(start || end);
  }

  // Short version of the PP classification for on-screen labels — everything
  // before the em dash, with a trailing "Completion" stripped. The full
  // official wording is preserved in storage and in the Copy Details text.
  function shortPpTypeLabel(full){
    if(!full) return '';
    let short = full.split('—')[0].trim();
    short = short.replace(/\s*Completion$/i, '').trim();
    return short;
  }

  // Drops bracketed example lists (e.g. "(barista, software training, food
  // safety etc)") but keeps the rest, including any Accredited/Non-Accredited
  // qualifier — used for the Copy Details text.
  function mediumPpTypeLabel(full){
    if(!full) return '';
    return full.replace(/\s*\([^)]*\)/g, '').trim();
  }

  function capacityPhrase(a){
    const total = a.capacityTotal ? parseInt(a.capacityTotal, 10) : null;
    const filled = a.capacityFilled ? parseInt(a.capacityFilled, 10) : 0;
    if(total){
      const remaining = total - filled;
      if(remaining <= 0) return 'Full';
      if(remaining === 1) return '1 remaining';
      return `${remaining} remaining`;
    }
    if(a.capacityFilled) return `${a.capacityFilled} filled`;
    return '';
  }

  function locationCapacityLine(a){
    const cap = capacityPhrase(a);
    if(a.location && cap) return `${a.location} (${cap})`;
    if(a.location) return a.location;
    if(cap) return `(${cap})`;
    return '';
  }

  function activityOnDay(a, dStr){
    return a.startDate <= dStr && dStr <= a.endDate;
  }
  function activityVisible(a){
    return a.sites.some(s=>activeFilters.has(s));
  }

  function showConfigWarning(){
    const grid = document.getElementById('grid');
    if(grid) grid.insertAdjacentHTML('beforebegin',
      '<div style="background:#FDEEDC;border:1px solid #E3A857;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#7A4B0A;">'
      + 'Not connected to shared storage yet — replace the firebaseConfig placeholder values in the code with your real Firebase config. Changes made now will not save.'
      + '</div>');
  }

  async function saveActivities(){
    if(CONFIG_IS_PLACEHOLDER){ storageOK = false; return; }
    try{
      await docRef.set({ activities }, { merge:true });
      storageOK = true;
    }catch(e){
      storageOK = false;
    }
  }

  function startRealtimeSync(){
    if(CONFIG_IS_PLACEHOLDER){
      showConfigWarning();
      render();
      return;
    }
    docRef.onSnapshot((snap)=>{
      const data = snap.exists ? snap.data() : {};
      activities = (data.activities || []).map(normalizeActivity);
      render();
      if(!data.seeded){
        seedIfNeeded();
      }
    }, (err)=>{
      console.error('Firestore sync error', err);
    });
  }

  function buildFilters(){
    const wrap = document.getElementById('filters');
    wrap.innerHTML = '';
    SITES.forEach(s=>{
      const row = document.createElement('label');
      row.className = 'filter-row';
      row.innerHTML = `
        <input type="checkbox" ${activeFilters.has(s.id)?'checked':''} data-site="${s.id}">
        <span class="swatch" style="background:${s.hex}"></span>
        <span>${s.name}</span>
      `;
      row.querySelector('input').addEventListener('change', (e)=>{
        if(e.target.checked) activeFilters.add(s.id);
        else activeFilters.delete(s.id);
        row.classList.toggle('off', !e.target.checked);
        render();
      });
      wrap.appendChild(row);
    });
  }

  function monthLabel(d){
    return d.toLocaleDateString('en-AU', {month:'long', year:'numeric'});
  }

  function buildGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    document.getElementById('monthLabel').textContent = monthLabel(viewDate);

    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    // Monday-start offset
    let startOffset = firstOfMonth.getDay() - 1;
    if(startOffset < 0) startOffset = 6;

    const gridStart = new Date(year, month, 1 - startOffset);
    const totalCells = 42;

    for(let i=0;i<totalCells;i++){
      const cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate() + i);
      const dStr = fmtDate(cellDate);
      const isOutside = cellDate.getMonth() !== month;
      const isToday = dStr === todayStr();
      const isSelected = dStr === selectedDateStr;

      const dayActs = activities.filter(a => activityOnDay(a, dStr) && activityVisible(a));

      const cell = document.createElement('div');
      cell.className = 'day' + (isOutside?' outside':'') + (isToday?' today':'') + (isSelected?' selected':'');
      cell.dataset.date = dStr;

      const top = document.createElement('div');
      top.style.display='flex';
      top.style.justifyContent='space-between';
      top.style.alignItems='center';
      const num = document.createElement('span');
      num.className='daynum';
      num.textContent = cellDate.getDate();
      top.appendChild(num);
      if(dayActs.length){
        const cnt = document.createElement('span');
        cnt.className='daycount';
        cnt.textContent = dayActs.length;
        top.appendChild(cnt);
      }
      cell.appendChild(top);

      const rows = document.createElement('div');
      rows.className='site-rows';
      SITES.forEach(s=>{
        const siteActs = activeFilters.has(s.id)
          ? dayActs.filter(a=>a.sites.includes(s.id))
          : [];
        const row = document.createElement('div');
        row.className = 'site-row' + (siteActs.length ? ' filled' : '');
        if(siteActs.length){
          const fill = document.createElement('span');
          fill.className='site-row-fill';
          fill.style.background = s.hex;
          row.appendChild(fill);

          const tip = document.createElement('div');
          tip.className='site-tooltip';
          let tipHtml = `<span class="st-site">${escapeHtml(s.name)}</span>`;
          siteActs.forEach(a=>{
            tipHtml += `${escapeHtml(a.title)}${a.activityId ? ' — ID '+escapeHtml(a.activityId) : ''}<br>`;
          });
          tip.innerHTML = tipHtml;
          row.appendChild(tip);

          if(siteActs.length === 1){
            row.addEventListener('click', (e)=>{
              e.stopPropagation();
              selectedDateStr = dStr;
              render();
              showActivityDetail(siteActs[0]);
            });
          }
        }
        rows.appendChild(row);
      });
      cell.appendChild(rows);

      cell.addEventListener('click', ()=>{
        selectedDateStr = dStr;
        render();
      });

      grid.appendChild(cell);
    }
  }

  function renderDetail(){
    const heading = document.getElementById('detailHeading');
    const sub = document.getElementById('detailSub');
    const list = document.getElementById('activityList');
    const addBtn = document.getElementById('openAddBtn');
    if(addBtn) addBtn.style.display = isEditor ? 'block' : 'none';

    const d = new Date(selectedDateStr + 'T00:00:00');
    heading.textContent = d.toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'long'});
    sub.textContent = selectedDateStr === todayStr() ? 'Today' : '';

    let dayActs = activities
      .filter(a=>activityOnDay(a, selectedDateStr) && activityVisible(a));

    dayActs = sortActivities(dayActs, sortMode);

    list.innerHTML = '';
    if(dayActs.length===0){
      const p = document.createElement('div');
      p.className='empty-note';
      p.textContent = 'No activities showing for this day.';
      list.appendChild(p);
      return;
    }
    dayActs.forEach(a=>{
      const visibleSites = a.sites.filter(s=>activeFilters.has(s)).map(s=>siteById(s)).filter(Boolean);
      const primary = visibleSites[0];
      const item = document.createElement('div');
      item.className='activity-item' + (a.id===flashId ? ' flash' : '');
      item.style.borderLeftColor = primary ? primary.hex : '#999';
      item.style.cursor = 'pointer';
      item.dataset.id = a.id;
      const siteNames = visibleSites.map(s=>s.name).join(', ');
      const dayLabel = formatDateRangeLabel(a.startDate, a.endDate);
      const timeLabel = formatTimeRangeLabel(a.time, a.endTime);
      const capLine = locationCapacityLine(a);
      item.innerHTML = `
        ${isEditor ? `<button class="a-del" title="Delete" data-id="${a.id}">&times;</button>
        <button class="a-edit" title="Edit" data-id="${a.id}">&#9998;</button>` : ''}
        <div class="a-title">${escapeHtml(a.title)}${a.activityId ? `<span class="a-id">ID ${escapeHtml(a.activityId)}</span>` : ''}</div>
        ${a.ppType ? `<div style="font-style:italic; font-size:11px; color:var(--ink-soft); margin-bottom:2px;">${escapeHtml(shortPpTypeLabel(a.ppType))}</div>` : ''}
        <div class="a-meta">${siteNames} · ${dayLabel}${timeLabel ? ' · '+timeLabel : ''}</div>
        ${capLine ? `<div class="a-notes">${escapeHtml(capLine)}</div>` : ''}
        ${a.notes ? `<div class="a-notes">${escapeHtml(a.notes)}</div>` : ''}
      `;
      item.addEventListener('click', ()=> showActivityDetail(a));
      if(isEditor){
        item.querySelector('.a-del').addEventListener('click', (e)=>{
          e.stopPropagation();
          deleteActivity(a.id);
        });
        item.querySelector('.a-edit').addEventListener('click', (e)=>{
          e.stopPropagation();
          openModal(a);
        });
      }
      list.appendChild(item);
    });

    if(flashId){
      const el = list.querySelector(`[data-id="${flashId}"]`);
      if(el) el.scrollIntoView({block:'nearest'});
      flashId = null;
    }
  }

  function sortActivities(list, mode){
    const arr = list.slice();
    if(mode === 'alpha'){
      arr.sort((a,b)=> a.title.localeCompare(b.title));
    }else if(mode === 'site'){
      arr.sort((a,b)=>{
        const sa = SITES.findIndex(s=>a.sites.includes(s.id));
        const sb = SITES.findIndex(s=>b.sites.includes(s.id));
        if(sa!==sb) return sa-sb;
        return (a.time||'99:99').localeCompare(b.time||'99:99');
      });
    }else{
      arr.sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99'));
    }
    return arr;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Read-only detail view, tap/click accessible to everyone
  const detailOverlay = document.getElementById('detailOverlay');
  let currentDetailActivity = null;

  function showActivityDetail(a){
    currentDetailActivity = a;
    const visibleSites = a.sites.filter(s=>activeFilters.has(s)).map(s=>siteById(s)).filter(Boolean);
    const siteNames = visibleSites.map(s=>s.name).join(', ') || a.sites.join(', ');
    const dayLabel = formatDateRangeLabel(a.startDate, a.endDate);
    const timeLabel = formatTimeRangeLabel(a.time, a.endTime);

    document.getElementById('detailModalTitle').textContent = a.title;
    let rows = '';
    if(a.ppType) rows += `<div style="font-style:italic; color:var(--ink-soft); margin-bottom:8px;">${escapeHtml(a.ppType)}</div>`;
    rows += `<div><strong>Site${a.sites.length>1?'s':''}:</strong> ${escapeHtml(siteNames)}</div>`;
    rows += `<div><strong>Day:</strong> ${escapeHtml(dayLabel)}</div>`;
    if(timeLabel) rows += `<div><strong>Time:</strong> ${escapeHtml(timeLabel)}</div>`;
    if(a.location) rows += `<div><strong>Location:</strong> ${escapeHtml(a.location)}</div>`;
    if(a.activityId) rows += `<div><strong>Activity ID:</strong> ${escapeHtml(a.activityId)}</div>`;
    if(a.capacityTotal || a.capacityFilled){
      const capText = a.capacityTotal ? `${a.capacityFilled||0}/${a.capacityTotal} spots filled` : `${a.capacityFilled} filled`;
      rows += `<div><strong>Capacity:</strong> ${escapeHtml(capText)}</div>`;
    }
    if(a.notes) rows += `<div style="margin-top:8px;"><strong>Notes:</strong><br>${escapeHtml(a.notes)}</div>`;
    document.getElementById('detailModalBody').innerHTML = rows;
    document.getElementById('detailCopyMsg').textContent = '';
    detailOverlay.classList.add('show');
  }

  document.getElementById('detailCloseBtn').addEventListener('click', ()=>{
    detailOverlay.classList.remove('show');
  });
  detailOverlay.addEventListener('click', (e)=>{
    if(e.target===detailOverlay) detailOverlay.classList.remove('show');
  });

  document.getElementById('detailCopyBtn').addEventListener('click', async ()=>{
    if(!currentDetailActivity) return;
    const a = currentDetailActivity;
    const visibleSites = a.sites.filter(s=>activeFilters.has(s)).map(s=>siteById(s)).filter(Boolean);
    const siteNames = visibleSites.map(s=>s.name).join(', ') || a.sites.join(', ');
    const dayLabel = formatDateRangeLabel(a.startDate, a.endDate);
    const timeLabel = formatTimeRangeLabel(a.time, a.endTime);

    let text = `${a.title}\n${siteNames}\n${dayLabel}`;
    if(a.ppType) text += `\n${mediumPpTypeLabel(a.ppType)}`;
    if(timeLabel) text += `\n${timeLabel}`;
    if(a.location) text += `\n${a.location}`;
    if(a.activityId) text += `\nActivity ID: ${a.activityId}`;
    if(a.capacityTotal || a.capacityFilled){
      text += a.capacityTotal ? `\n${a.capacityFilled||0}/${a.capacityTotal} spots filled` : `\n${a.capacityFilled} filled`;
    }
    if(a.notes) text += `\n${a.notes}`;

    const msg = document.getElementById('detailCopyMsg');
    try{
      await navigator.clipboard.writeText(text);
      msg.style.color = 'var(--ink-soft)';
      msg.textContent = 'Copied to clipboard.';
    }catch(e){
      msg.style.color = '#B5443B';
      msg.textContent = 'Could not copy automatically — select and copy the text above manually.';
    }
  });

  async function deleteActivity(id){
    activities = activities.filter(a=>a.id!==id);
    await saveActivities();
    render();
  }

  function renderTwoWeek(){
    const container = document.getElementById('twoWeekList');
    if(!container) return;
    container.innerHTML = '';
    const start = new Date(); start.setHours(0,0,0,0);
    let any = false;

    for(let i=0; i<14; i++){
      const d = new Date(start);
      d.setDate(d.getDate()+i);
      const dStr = fmtDate(d);
      const dayActs = activities.filter(a=>activityOnDay(a, dStr) && activityVisible(a));
      if(dayActs.length===0) continue;
      any = true;

      const label = d.toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'});
      const block = document.createElement('div');
      block.style.marginBottom = '10px';
      block.innerHTML = `<div style="font-size:11px; font-weight:700; margin-bottom:3px;">${escapeHtml(label)}</div>`;

      dayActs.forEach(a=>{
        const primarySite = a.sites.find(s=>activeFilters.has(s));
        const primary = siteById(primarySite);
        const row = document.createElement('div');
        row.style.cssText = 'font-size:11px; margin-bottom:2px; padding-left:2px; cursor:pointer;';
        row.innerHTML = `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${primary?primary.hex:'#999'};margin-right:5px;"></span>${escapeHtml(a.title)}`;
        row.addEventListener('click', ()=>{
          selectedDateStr = dStr;
          viewDate = new Date(dStr + 'T00:00:00');
          flashId = a.id;
          render();
        });
        block.appendChild(row);
      });
      container.appendChild(block);
    }

    if(!any){
      container.innerHTML = '<div class="empty-note">No activities in the next 14 days.</div>';
    }
  }

  function render(){
    buildGrid();
    renderDetail();
    renderTwoWeek();
  }

  // Nav
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
    render();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    viewDate = new Date();
    selectedDateStr = todayStr();
    render();
  });

  // Modal
  const overlay = document.getElementById('overlay');
  const siteOptionsWrap = document.getElementById('siteOptions');
  let modalSites = new Set();
  let conflictConfirmed = false;

  function findConflicts(sites, startDate, endDate, time, excludeId){
    return activities.filter(a=>{
      if(a.id===excludeId) return false;
      if(!a.sites.some(s=>sites.includes(s))) return false;
      if(!(startDate <= a.endDate && a.startDate <= endDate)) return false;
      if(time && a.time && time !== a.time) return false; // both have times and they differ — not a conflict
      return true;
    });
  }

  function buildSiteOptions(){
    siteOptionsWrap.innerHTML = '';
    SITES.forEach(s=>{
      const chip = document.createElement('div');
      chip.className = 'site-chip' + (modalSites.has(s.id) ? ' active':'');
      chip.innerHTML = `<span class="swatch" style="background:${s.hex}"></span>${s.name}`;
      chip.addEventListener('click', ()=>{
        if(modalSites.has(s.id)) modalSites.delete(s.id);
        else modalSites.add(s.id);
        conflictConfirmed = false;
        document.getElementById('saveBtn').textContent = 'Save';
        buildSiteOptions();
      });
      siteOptionsWrap.appendChild(chip);
    });
  }

  const activityIdInput = document.getElementById('fActivityId');
  activityIdInput.addEventListener('input', (e)=>{
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
  });

  ['fDateStart','fDateEnd','fTimeStart','fTimeEnd','fTitle'].forEach(id=>{
    document.getElementById(id).addEventListener('input', ()=>{
      conflictConfirmed = false;
      document.getElementById('saveBtn').textContent = 'Save';
    });
  });

  function openModal(activityToEdit){
    if(activityToEdit){
      editingId = activityToEdit.id;
      document.getElementById('modalTitle').textContent = 'Edit activity';
      document.getElementById('fTitle').value = activityToEdit.title;
      document.getElementById('fDateStart').value = activityToEdit.startDate;
      document.getElementById('fDateEnd').value = activityToEdit.endDate;
      document.getElementById('fTimeStart').value = activityToEdit.time || '';
      document.getElementById('fTimeEnd').value = activityToEdit.endTime || '';
      document.getElementById('fLocation').value = activityToEdit.location || '';
      document.getElementById('fActivityId').value = activityToEdit.activityId || '';
      document.getElementById('fPpType').value = activityToEdit.ppType || '';
      document.getElementById('fCapacityFilled').value = activityToEdit.capacityFilled || '';
      document.getElementById('fCapacityTotal').value = activityToEdit.capacityTotal || '';
      document.getElementById('fNotes').value = activityToEdit.notes || '';
      modalSites = new Set(activityToEdit.sites);
    }else{
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add activity';
      document.getElementById('fTitle').value = '';
      document.getElementById('fDateStart').value = selectedDateStr;
      document.getElementById('fDateEnd').value = selectedDateStr;
      document.getElementById('fTimeStart').value = '';
      document.getElementById('fTimeEnd').value = '';
      document.getElementById('fLocation').value = '';
      document.getElementById('fActivityId').value = '';
      document.getElementById('fPpType').value = '';
      document.getElementById('fCapacityFilled').value = '';
      document.getElementById('fCapacityTotal').value = '';
      document.getElementById('fNotes').value = '';
      modalSites = new Set([SITES[0].id]);
    }
    buildSiteOptions();
    conflictConfirmed = false;
    document.getElementById('saveBtn').textContent = 'Save';
    document.getElementById('statusMsg').textContent = '';
    overlay.classList.add('show');
    document.getElementById('fTitle').focus();
  }

  function closeModal(){
    overlay.classList.remove('show');
  }

  document.getElementById('openAddBtn').addEventListener('click', ()=>openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('fTitle').value.trim();
    const startDate = document.getElementById('fDateStart').value;
    let endDate = document.getElementById('fDateEnd').value;
    const time = document.getElementById('fTimeStart').value;
    const endTime = document.getElementById('fTimeEnd').value;
    const location = document.getElementById('fLocation').value.trim();
    const activityId = document.getElementById('fActivityId').value.trim();
    const ppType = document.getElementById('fPpType').value;
    const capacityFilled = document.getElementById('fCapacityFilled').value.trim();
    const capacityTotal = document.getElementById('fCapacityTotal').value.trim();
    const notes = document.getElementById('fNotes').value.trim();
    const statusMsg = document.getElementById('statusMsg');

    if(!endDate) endDate = startDate;

    if(!title || !startDate || modalSites.size===0){
      statusMsg.textContent = 'Title, at least one site, and a start date are required.';
      statusMsg.style.color = '#B5443B';
      return;
    }
    if(endDate < startDate){
      statusMsg.textContent = 'End date can\'t be before the start date.';
      statusMsg.style.color = '#B5443B';
      return;
    }
    if(time && endTime && endTime < time){
      statusMsg.textContent = 'End time can\'t be before the start time.';
      statusMsg.style.color = '#B5443B';
      return;
    }

    const sitesArr = Array.from(modalSites);

    if(!conflictConfirmed){
      const conflicts = findConflicts(sitesArr, startDate, endDate, time, editingId);
      if(conflicts.length > 0){
        const names = conflicts.map(c=>{
          const siteNames = c.sites.map(s=>siteById(s)?siteById(s).name:s).join(', ');
          return `${c.title} (${siteNames}${c.time? ', '+c.time : ''})`;
        }).join('; ');
        statusMsg.style.color = '#B5443B';
        statusMsg.textContent = `Possible double-booking with: ${names}. Click Save again to save anyway.`;
        conflictConfirmed = true;
        document.getElementById('saveBtn').textContent = 'Save anyway';
        return;
      }
    }

    if(editingId){
      const idx = activities.findIndex(a=>a.id===editingId);
      if(idx>-1){
        activities[idx] = { ...activities[idx], title, sites:sitesArr, startDate, endDate, time, endTime, location, activityId, ppType, capacityFilled, capacityTotal, notes };
      }
    }else{
      activities.push({
        id: 'a_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        title, sites:sitesArr, startDate, endDate, time, endTime, location, activityId, ppType, capacityFilled, capacityTotal, notes
      });
    }

    statusMsg.style.color = 'var(--ink-soft)';
    statusMsg.textContent = 'Saving...';
    await saveActivities();

    if(storageOK){
      selectedDateStr = startDate;
      viewDate = new Date(startDate + 'T00:00:00');
      closeModal();
      render();
    }else{
      statusMsg.textContent = 'Could not save — try again.';
      statusMsg.style.color = '#B5443B';
    }
  });

  // Export
  function pad2(n){ return String(n).padStart(2,'0'); }
  function toICSDateStr(dateStr){ return dateStr.replace(/-/g,''); }
  function addOneDay(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate()+1);
    return fmtDate(d);
  }
  function icsEscape(str){
    return String(str||'')
      .replace(/\\/g,'\\\\')
      .replace(/;/g,'\\;')
      .replace(/,/g,'\\,')
      .replace(/\n/g,'\\n');
  }

  function exportableActivities(){
    return activities
      .filter(activityVisible)
      .slice()
      .sort((a,b)=> (a.startDate+(a.time||'')).localeCompare(b.startDate+(b.time||'')));
  }

  document.getElementById('exportExcelBtn').addEventListener('click', ()=>{
    const rows = exportableActivities().map(a=>({
      'Start Date': a.startDate,
      'End Date': a.endDate,
      Sites: a.sites.filter(s=>activeFilters.has(s)).map(s=> siteById(s)? siteById(s).name : s).join(', '),
      Title: a.title,
      'Activity ID': a.activityId || '',
      Time: a.time || '',
      Notes: a.notes || ''
    }));
    if(rows.length===0){ rows.push({'Start Date':'','End Date':'',Sites:'',Title:'No activities match current filters','Activity ID':'',Time:'',Notes:''}); }
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:11},{wch:11},{wch:20},{wch:32},{wch:11},{wch:8},{wch:40}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Activities');
    XLSX.writeFile(wb, 'activity-calendar.xlsx');
  });

  document.getElementById('exportPdfBtn').addEventListener('click', ()=>{
    const rows = exportableActivities();
    const activeSiteNames = SITES.filter(s=>activeFilters.has(s.id)).map(s=>s.name).join(', ');
    let html = `<h1>Activity Calendar</h1><div class="print-sub">Sites: ${escapeHtml(activeSiteNames || 'None')} · Generated ${new Date().toLocaleDateString('en-AU')}</div>`;
    html += '<table><thead><tr><th>Start</th><th>End</th><th>Sites</th><th>Title</th><th>Activity ID</th><th>Time</th><th>Notes</th></tr></thead><tbody>';
    if(rows.length===0){
      html += '<tr><td colspan="7">No activities match current filters.</td></tr>';
    }else{
      rows.forEach(a=>{
        const siteNames = a.sites.filter(s=>activeFilters.has(s)).map(s=> siteById(s)? siteById(s).name : s).join(', ');
        html += `<tr><td>${escapeHtml(a.startDate)}</td><td>${escapeHtml(a.endDate)}</td><td>${escapeHtml(siteNames)}</td><td>${escapeHtml(a.title)}</td><td>${escapeHtml(a.activityId||'')}</td><td>${escapeHtml(a.time||'')}</td><td>${escapeHtml(a.notes||'')}</td></tr>`;
      });
    }
    html += '</tbody></table>';
    document.getElementById('printArea').innerHTML = html;
    window.print();
  });

  document.getElementById('printMonthBtn').addEventListener('click', ()=>{
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    let startOffset = firstOfMonth.getDay() - 1;
    if(startOffset < 0) startOffset = 6;
    const gridStart = new Date(year, month, 1 - startOffset);

    const activeSiteNames = SITES.filter(s=>activeFilters.has(s.id)).map(s=>s.name).join(', ');
    let html = `<h1>Activity Calendar — ${escapeHtml(monthLabel(viewDate))}</h1>`;
    html += `<div class="print-sub">Sites: ${escapeHtml(activeSiteNames || 'None')} · Generated ${new Date().toLocaleDateString('en-AU')}</div>`;
    html += '<table class="month-print"><thead><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr></thead><tbody>';

    for(let week=0; week<6; week++){
      html += '<tr>';
      for(let d=0; d<7; d++){
        const cellDate = new Date(gridStart);
        cellDate.setDate(gridStart.getDate() + week*7 + d);
        const dStr = fmtDate(cellDate);
        const isOutside = cellDate.getMonth() !== month;
        const dayActs = activities.filter(a => activityOnDay(a, dStr) && activityVisible(a));

        html += `<td class="${isOutside?'outside-month':''}"><span class="mp-daynum">${cellDate.getDate()}</span>`;
        dayActs.forEach(a=>{
          const primary = siteById(a.sites.find(s=>activeFilters.has(s)));
          html += `<div class="mp-act"><span class="mp-dot" style="background:${primary?primary.hex:'#999'}"></span>${escapeHtml(a.title)}</div>`;
        });
        html += '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table>';

    document.getElementById('printArea').innerHTML = html;
    window.print();
  });

  document.getElementById('exportIcsBtn').addEventListener('click', ()=>{
    const rows = exportableActivities();
    const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
    let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//WISE Activity Calendar//EN\r\nCALSCALE:GREGORIAN\r\n';

    rows.forEach(a=>{
      const siteNames = a.sites.filter(s=>activeFilters.has(s)).map(s=> siteById(s)? siteById(s).name : s).join(', ');
      let desc = siteNames;
      if(a.activityId) desc += ' | ID ' + a.activityId;
      if(a.notes) desc += ' | ' + a.notes;

      ics += 'BEGIN:VEVENT\r\n';
      ics += 'UID:' + a.id + '@wise-activity-calendar\r\n';
      ics += 'DTSTAMP:' + stamp + '\r\n';
      if(a.time){
        const t = a.time.replace(':','') + '00';
        ics += 'DTSTART:' + toICSDateStr(a.startDate) + 'T' + t + '\r\n';
        ics += 'DTEND:' + toICSDateStr(a.endDate) + 'T' + t + '\r\n';
      }else{
        ics += 'DTSTART;VALUE=DATE:' + toICSDateStr(a.startDate) + '\r\n';
        ics += 'DTEND;VALUE=DATE:' + toICSDateStr(addOneDay(a.endDate)) + '\r\n';
      }
      ics += 'SUMMARY:' + icsEscape(a.title) + '\r\n';
      ics += 'DESCRIPTION:' + icsEscape(desc) + '\r\n';
      ics += 'LOCATION:' + icsEscape(siteNames) + '\r\n';
      ics += 'END:VEVENT\r\n';
    });
    ics += 'END:VCALENDAR\r\n';

    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'activity-calendar.ics';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  });

  // Sort control
  document.getElementById('sortSelect').addEventListener('change', (e)=>{
    sortMode = e.target.value;
    renderDetail();
  });

  // Search
  const searchInput = document.getElementById('searchInput');
  const searchWrap = document.getElementById('searchWrap');
  const searchResults = document.getElementById('searchResults');
  const searchClear = document.getElementById('searchClear');

  function fmtShortDate(dStr){
    const d = new Date(dStr + 'T00:00:00');
    return d.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'});
  }

  function runSearch(query){
    const q = query.trim().toLowerCase();
    searchWrap.classList.toggle('has-text', q.length>0);
    if(q.length===0){
      searchResults.classList.remove('show');
      searchResults.innerHTML='';
      return;
    }
    const matches = activities
      .filter(a=> a.title.toLowerCase().includes(q))
      .sort((a,b)=> a.startDate.localeCompare(b.startDate));

    searchResults.innerHTML = '';
    if(matches.length===0){
      const empty = document.createElement('div');
      empty.className='search-empty';
      empty.textContent = 'No activities match.';
      searchResults.appendChild(empty);
    }else{
      matches.forEach(a=>{
        const primary = siteById(a.sites[0]);
        const row = document.createElement('div');
        row.className='search-result-item';
        row.innerHTML = `
          <span class="swatch" style="background:${primary?primary.hex:'#999'}"></span>
          <span class="sr-title">${escapeHtml(a.title)}</span>
          <span class="sr-date">${fmtShortDate(a.startDate)}${a.time? ' · '+a.time:''}</span>
        `;
        row.addEventListener('click', ()=>{
          jumpToActivity(a);
        });
        searchResults.appendChild(row);
      });
    }
    searchResults.classList.add('show');
  }

  function jumpToActivity(a){
    viewDate = new Date(a.startDate + 'T00:00:00');
    selectedDateStr = a.startDate;
    let filtersChanged = false;
    a.sites.forEach(s=>{
      if(!activeFilters.has(s)){ activeFilters.add(s); filtersChanged = true; }
    });
    if(filtersChanged) buildFilters();
    flashId = a.id;
    searchResults.classList.remove('show');
    searchInput.value = '';
    searchWrap.classList.remove('has-text');
    render();
  }

  searchInput.addEventListener('input', (e)=> runSearch(e.target.value));
  searchInput.addEventListener('focus', (e)=>{ if(e.target.value.trim()) runSearch(e.target.value); });
  searchClear.addEventListener('click', ()=>{
    searchInput.value='';
    searchWrap.classList.remove('has-text');
    searchResults.classList.remove('show');
    searchInput.focus();
  });
  document.addEventListener('click', (e)=>{
    if(!searchWrap.contains(e.target)) searchResults.classList.remove('show');
  });

  const SEED_ACTIVITIES = [
    {startDate:'2026-07-27', endDate:'2026-07-27', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-07-28', endDate:'2026-07-28', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-07-29', endDate:'2026-07-29', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-07-30', endDate:'2026-07-30', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-07-31', endDate:'2026-07-31', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-08-17', endDate:'2026-08-17', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-08-17', endDate:'2026-08-17', sites:['hornsby'], title:'Intro to AI'},
    {startDate:'2026-08-18', endDate:'2026-08-18', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-08-18', endDate:'2026-08-18', sites:['chatswood'], title:'Prime Effect: Game On'},
    {startDate:'2026-08-19', endDate:'2026-08-19', sites:['chatswood'], title:'Prime Effect: Game On'},
    {startDate:'2026-08-19', endDate:'2026-08-19', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-08-20', endDate:'2026-08-20', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-08-21', endDate:'2026-08-21', sites:['ryde','hornsby'], title:'Digital Ready'},
    {startDate:'2026-08-25', endDate:'2026-08-25', sites:['chatswood'], title:'Intro to AI'},
    {startDate:'2026-08-31', endDate:'2026-09-04', sites:['ryde'], title:'Gen U Hospitality course'},
    {startDate:'2026-09-01', endDate:'2026-09-01', sites:['brookvale'], title:'Intro to AI'},
    {startDate:'2026-09-08', endDate:'2026-09-08', sites:['chatswood'], title:'Responsible AI'},
    {startDate:'2026-09-15', endDate:'2026-09-15', sites:['chatswood'], title:'Responsible AI'}
  ];

  async function seedIfNeeded(){
    if(CONFIG_IS_PLACEHOLDER) return;
    try{
      const snap = await docRef.get();
      const data = snap.exists ? snap.data() : {};
      if(data.seeded) return;

      const seeded = SEED_ACTIVITIES.map((a,i)=>({
        id: 'seed_' + i + '_' + a.startDate + '_' + a.sites.join('-'),
        title: a.title,
        sites: a.sites,
        startDate: a.startDate,
        endDate: a.endDate,
        time: '',
        activityId: '',
        notes: a.sites.length>1 ? ('Runs across ' + a.sites.map(s=>siteById(s)?siteById(s).name:s).join(' & ')) : ''
      }));
      const existing = (data.activities || []).map(normalizeActivity);
      const existingIds = new Set(existing.map(a=>a.id));
      const merged = existing.slice();
      seeded.forEach(s=>{ if(!existingIds.has(s.id)) merged.push(s); });

      await docRef.set({ activities: merged, seeded:true }, { merge:true });
    }catch(e){ /* seeding is best-effort */ }
  }

  // Init
  buildFilters();
  startRealtimeSync();

  // Auth
  const signInBtn = document.getElementById('signInBtn');
  const signInForm = document.getElementById('signInForm');
  const signedInWidget = document.getElementById('signedInWidget');
  const authError = document.getElementById('authError');

  if(auth){
    auth.onAuthStateChanged((user)=>{
      isEditor = !!user;
      if(user){
        signInBtn.style.display = 'none';
        signInForm.style.display = 'none';
        signedInWidget.style.display = 'flex';
        document.getElementById('authUserEmail').textContent = user.email;
      }else{
        signInBtn.style.display = 'inline-block';
        signInForm.style.display = 'none';
        signedInWidget.style.display = 'none';
      }
      render();
    });
  }else{
    signInBtn.style.display = 'none';
  }

  signInBtn.addEventListener('click', ()=>{
    signInForm.style.display = 'flex';
    signInBtn.style.display = 'none';
    authError.textContent = '';
  });
  document.getElementById('authCancelBtn').addEventListener('click', ()=>{
    signInForm.style.display = 'none';
    signInBtn.style.display = 'inline-block';
  });
  document.getElementById('authSubmitBtn').addEventListener('click', ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    authError.textContent = '';
    auth.signInWithEmailAndPassword(email, password).catch((err)=>{
      authError.textContent = 'Could not sign in: ' + err.message + ' (' + err.code + ')';
    });
  });
  document.getElementById('signOutBtn').addEventListener('click', ()=>{
    auth.signOut();
  });
})();
</script>
